<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Java Lab – Lectures 1–4</title>
<style>
:root{
  --bg:#EEF2F9; --panel:#FFFFFF; --ink:#0F1F3D; --muted:#586A8E; --line:#D5DEEE;
  --blue:#1E4FD6; --blue-d:#1638A3; --blue-l:#E4ECFF;
  --sun:#F5A300; --sun-l:#FFF1D0;
  --ok:#12805A; --ok-l:#DDF5EA; --bad:#C92A3A; --bad-l:#FDE4E7;
  --con:#0F1B36; --con-ink:#E6EDFF; --con-dim:#8FA3CC;
  --code-bg:#F6F8FD;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-head:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --panel:#161F35; --ink:#EAF0FF; --muted:#93A2C6; --line:#28345A; --code-bg:#101A30;
    --blue-l:#22335E; --blue-d:#9CC0FF;
    --ok-l:#123526; --ok:#3ECF8E;
    --bad-l:#3B141B; --bad:#FF7A86;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --panel:#161F35; --ink:#EAF0FF; --muted:#93A2C6; --line:#28345A; --code-bg:#101A30;
  --blue-l:#22335E; --blue-d:#9CC0FF;
  --ok-l:#123526; --ok:#3ECF8E;
  --bad-l:#3B141B; --bad:#FF7A86;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}

/* ---------- sidebar ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:700;font-size:22px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:17px;font-weight:700}
.me{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.me .row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.me .lv{font-weight:700;font-family:var(--f-head)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .35s}
.me small{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seglabel{font-size:13px;color:var(--muted);margin:0 0 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink)}
.nav button:hover{background:var(--code-bg)}
.nav button[aria-current="page"]{background:var(--blue-l);color:var(--blue-d)}
.nav .ico{display:grid;place-items:center;width:22px}
.nav .sub{display:block;font-weight:400;font-size:13px;color:var(--muted)}

/* ---------- main ---------- */
main{padding:28px clamp(16px,4vw,48px) 60px;max-width:1080px;width:100%}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;margin:0}
h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.01em}
h2{font-size:22px}
.lead{color:var(--muted);font-size:17px;max-width:62ch;margin:8px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,26px);margin-top:20px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--blue-l);color:var(--blue-d)}
.chip.l2{background:var(--sun-l);color:#8A5A00}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.progress>i{display:block;height:100%;background:var(--blue);transition:width .3s}
.qtext{font-size:clamp(18px,2.6vw,24px);font-family:var(--f-head);margin:14px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--code-bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.right{background:var(--ok-l);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--bad-l);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.opt code,.qtext code{font-family:var(--f-mono);font-size:.92em}
.fb{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:16px}
.fb.ok{background:var(--ok-l);border-left:5px solid var(--ok)}
.fb.no{background:var(--bad-l);border-left:5px solid var(--bad)}
.fb.info{background:var(--sun-l);border-left:5px solid var(--sun);color:#5B4300}
.fb b:first-child{display:block;margin-bottom:2px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{border:0;background:var(--blue);color:#fff;font-weight:700;padding:11px 20px;border-radius:10px;font-size:16px}
.btn:hover{background:#1638A3}
.btn.sec{background:var(--panel);color:var(--blue-d);border:2px solid var(--blue)}
.btn.sec:hover{background:var(--blue-l)}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted);color:var(--ink)}
.btn.go{background:var(--ok)}
.btn.go:hover{background:#0c6547}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.switch input{width:18px;height:18px}

/* code */
.code{font-family:var(--f-mono);font-size:clamp(13px,1.9vw,15.5px);line-height:1.6;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;overflow:auto;white-space:pre;tab-size:2}
.cm{color:#6B7FA6;font-style:italic}
.kw{color:var(--blue);font-weight:700}
.st{color:#B4470B}
.num{color:#7A3FB5}
.codeln{display:grid;grid-template-columns:34px 1fr;align-items:stretch}
.codeln .n{color:var(--muted);text-align:right;padding-right:10px;user-select:none;font-size:.85em}

/* console */
.console{background:var(--con);color:var(--con-ink);border-radius:12px;font-family:var(--f-mono);font-size:15px;line-height:1.6;overflow:hidden}
.console .ctitle{font-family:var(--f-body);font-size:13px;color:var(--con-dim);padding:9px 14px;border-bottom:1px solid #22345B;display:flex;justify-content:space-between}
.console .body{padding:12px 14px;min-height:96px;white-space:pre-wrap;word-break:break-word}
.console .err{color:#FFB4BC}
.console .errhead{color:#FF8C99;font-weight:700}
.console .hint{color:#FFD27A;font-family:var(--f-body);margin-top:8px;white-space:normal}
.console .dim{color:var(--con-dim)}
.caret{display:inline-block;width:8px;height:1.1em;background:var(--con-ink);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dlgs{display:flex;gap:12px;flex-wrap:wrap;padding:0 14px 14px}
.dlg{background:#D4D0C8;color:#000;font-family:Tahoma,Arial,sans-serif;font-size:13px;min-width:210px;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.dlg .t{background:linear-gradient(90deg,#0A246A,#A6CAF0);color:#fff;padding:3px 6px;font-weight:700;display:flex;justify-content:space-between}
.dlg .m{display:flex;gap:14px;align-items:center;padding:14px 16px}
.dlg .ic{width:32px;height:32px;border-radius:50%;background:#8F8FD0;color:#fff;font-weight:700;display:grid;place-items:center;font-size:18px;font-family:Georgia,serif}
.dlg .ic.ERROR_MESSAGE{background:#C33}.dlg .ic.WARNING_MESSAGE{background:#E0A800}.dlg .ic.QUESTION_MESSAGE{background:#4A8}
.dlg .ok{display:block;margin:0 auto 12px;padding:3px 26px;background:#D4D0C8;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;font:inherit}
textarea.ta{width:100%;font-family:var(--f-mono);font-size:16px;line-height:1.55;border:2px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;background:var(--panel);color:var(--ink)}
textarea.ta:focus{border-color:var(--blue);outline:none}
.lab{font-weight:700;margin:16px 0 6px;display:block}

/* fix mode */
.lines{display:grid;gap:4px}
.lines button{display:grid;grid-template-columns:34px 1fr;text-align:left;border:2px solid transparent;background:var(--code-bg);border-radius:8px;padding:3px 8px 3px 0;font-family:var(--f-mono);font-size:clamp(13px,1.9vw,15.5px);white-space:pre;overflow:auto}
.lines button .n{color:var(--muted);text-align:right;padding-right:10px;user-select:none;font-size:.85em}
.lines button:hover:not([disabled]){border-color:var(--blue)}
.lines button.nope{background:var(--bad-l);border-color:var(--bad);animation:shake .3s}
.lines button.flag{background:var(--bad-l);border-color:var(--bad)}
.lines button.fixed{background:var(--ok-l);border-color:var(--ok)}
.lines button[disabled]{cursor:default}
.lines .eof{font-style:italic;color:var(--muted)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* build */
.buildgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.buildgrid>*,.pg>*{min-width:0}
.zone{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.zone h3{font-size:15px;color:var(--muted);font-family:var(--f-body);font-weight:600;margin-bottom:2px}
.piece{min-width:0;display:flex;align-items:center;gap:6px;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:0}
.piece>button.txt{flex:1;min-width:0;text-align:left;border:0;background:transparent;font-family:var(--f-mono);font-size:14.5px;padding:8px 10px;white-space:pre;overflow:auto;border-radius:8px}
.piece>button.txt:hover{background:var(--blue-l)}
.piece .mv{display:flex;flex-direction:column}
.piece .mv button{border:0;background:transparent;padding:0 8px;line-height:1.1;color:var(--muted);font-size:13px}
.piece .mv button:hover{color:var(--blue)}
.empty{color:var(--muted);font-size:14px;padding:6px}

/* match */
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 18px;margin-top:16px}
.pairs .col{display:grid;gap:8px;align-content:start}
.tile{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left;font-size:15.5px;min-height:48px}
.tile.mono{font-family:var(--f-mono);font-weight:700}
.tile:hover:not([disabled]){border-color:var(--blue)}
.tile.sel{border-color:var(--blue);background:var(--blue-l)}
.tile.done{border-color:var(--ok);background:var(--ok-l);color:var(--ok);opacity:.75;cursor:default}
.tile.miss{border-color:var(--bad);background:var(--bad-l);animation:shake .3s}

/* playground */
.pg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.editor{display:grid;grid-template-columns:38px 1fr;border:2px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;height:360px}
.editor:focus-within{border-color:var(--blue)}
.gut{background:var(--code-bg);border-right:1px solid var(--line);color:var(--muted);font-family:var(--f-mono);font-size:14px;line-height:22px;padding:10px 6px 10px 0;text-align:right;overflow:hidden;user-select:none;white-space:pre}
.gut .bad{color:#fff;background:var(--bad);display:block;border-radius:3px 0 0 3px}
.editor textarea{border:0;outline:0;resize:none;font-family:var(--f-mono);font-size:14px;line-height:22px;padding:10px 12px;white-space:pre;overflow:auto;color:var(--ink);background:var(--panel);tab-size:2;width:100%;height:100%}
.tracev{font-family:var(--f-mono);font-size:14px;line-height:22px;overflow:auto;padding:10px 0;background:var(--panel)}
.tracev>div{white-space:pre;padding:0 12px}
.tracev>div.cur{background:#FFF1B8}
.goalbox{background:var(--sun-l);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:#5B4300}
.goalbox b{color:#5B4300}
.goalbox select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);max-width:100%}
.vars{font-family:var(--f-mono);font-size:14px;margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.vars span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.exrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:14px;color:var(--muted)}
.exrow button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 12px;font-size:14px}
.exrow button:hover{border-color:var(--blue);color:var(--blue-d)}

/* hero + home */
.hero{margin-top:20px}
.hero .console .body{min-height:130px}
.starts{display:grid;gap:0;margin-top:22px;border-top:1px solid var(--line)}
.starts .r{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:16px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.starts .r b{font-family:var(--f-head);font-size:19px;display:block}
.starts .r span{color:var(--muted)}
details{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
summary{font-weight:700;cursor:pointer}
details ol{margin:10px 0 0;padding-left:20px;color:var(--ink)}
details li{margin:6px 0}

/* progress screen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-family:var(--f-head);font-size:26px;display:block}
.stat span{color:var(--muted);font-size:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.badge{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}
.badge .medal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:#fff;font-weight:700}
.badge.on .medal{background:var(--sun)}
.badge:not(.on){opacity:.6}
.badge b{display:block;font-family:var(--f-head)}
.badge small{color:var(--muted)}
.namein{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;min-width:220px}
.namein:focus{border-color:var(--blue);outline:none}

/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .25s}
.toast.badge-t{background:var(--sun);color:#3A2600}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.result{text-align:center;padding:10px 0}
.result .big{font-family:var(--f-head);font-size:64px;line-height:1;margin:10px 0}
.stars{font-size:32px;letter-spacing:6px;color:var(--sun)}

/* class mode */
.classmode .qtext{font-size:clamp(24px,4vw,40px)}
.classmode .opt{font-size:clamp(20px,3vw,30px);padding:16px 18px}


/* lecture notes */
.notecard{margin-top:20px}
.notelabel{font-family:var(--f-head);font-weight:700;font-size:15px;color:var(--muted);margin:16px 0 8px}
.notecard>.notelabel:first-of-type{margin-top:18px}
.keypoints{margin:0;padding-left:22px;display:grid;gap:10px;min-width:0}
.keypoints li{font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.keypoints .term{color:var(--blue-d);background:var(--blue-l);border-radius:5px;padding:0 4px}
.summarybox{background:var(--sun-l);border-radius:12px;padding:4px 16px 14px}
.summarybox p{margin:0;font-size:15.5px;line-height:1.6;color:#5B4300}

/* direct questions + instructor */
.blank{display:inline-block;min-width:3.2ch;text-align:center;background:var(--sun-l);border:2px dashed var(--sun);border-radius:6px;color:#8A5A00;font-weight:700;padding:0 6px}
.inp{font-family:var(--f-mono);font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;width:min(100%,360px);background:var(--panel);color:var(--ink)}
.inp:focus{border-color:var(--blue);outline:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip.cat{background:#EDE7FB;color:#4B2C99}
.kwline{margin:-6px 0 14px;color:var(--muted);font-size:15px}
.kwchips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
code.kwc{margin-right:2px;font-family:var(--f-mono);background:var(--sun-l);color:#7A4E00;border-radius:6px;padding:1px 8px;font-weight:700;font-size:.92em}
code.kwc.small{font-size:12.5px;padding:0 6px}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:8px;cursor:pointer;align-items:start}
.qrow.on{border-color:var(--blue);background:var(--blue-l)}
.qrow.static{cursor:default;display:flex;gap:12px;flex-wrap:wrap}
.qrow input[type=checkbox]{width:20px;height:20px;margin-top:2px}
.qrow .qq{margin-top:6px;font-weight:600}
.qrow .ans{margin-top:6px;color:var(--muted);font-size:14.5px}
.qrow .ans code{font-family:var(--f-mono);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.qrow>div{min-width:0}
.qrow .qq,.qtext,.opt span,.fb,.tile{overflow-wrap:anywhere}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.filters select{font:inherit;padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel)}
.stickybar{position:sticky;bottom:64px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:14px;box-shadow:0 8px 26px rgba(15,31,61,.16);z-index:5}

/* lecture hub + instructor entry + modal */
.leccards{display:grid;gap:14px;margin-top:18px}
.leccard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.leccard .teaser{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:56ch}
.leccard .stat{font-size:13px;color:var(--muted);margin-top:6px}
.instrbtn{margin-top:auto;align-self:flex-start;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--code-bg);opacity:.55;flex:none}
.instrbtn:hover{opacity:1;border-color:var(--muted)}
.instrbtn::before{content:'⚙';font-size:16px}
#modalHost:empty{display:none}
.modalbg{position:fixed;inset:0;background:rgba(10,16,32,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modalbox{background:var(--panel);border-radius:16px;padding:24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modalbox h3{font-family:var(--f-head);margin:0 0 6px}
.modalbox p{color:var(--muted);font-size:14.5px;margin:0 0 14px}

<script>
"use strict";
/* =====================================================================
   1. Tiny Java simulator (print / println / comments / classes / blocks /
      variables / JOptionPane.showMessageDialog) with friendly errors
   ===================================================================== */
const KEYWORDS=new Set(['abstract','boolean','break','byte','case','catch','char','class','continue','default','do','double','else','enum','extends','final','finally','float','for','if','implements','import','instanceof','int','interface','long','new','package','private','protected','public','return','short','static','super','switch','this','throw','throws','try','void','volatile','while','null','true','false']);
class JErr{constructor(line,msg,hint){this.line=line;this.msg=msg;this.hint=hint||'';}}

function tokenize(src){
  const toks=[];let i=0,line=1;const n=src.length;
  while(i<n){
    const c=src[i];
    if(c==='\n'){line++;i++;continue;}
    if(/\s/.test(c)){i++;continue;}
    if(c==='/'&&src[i+1]==='/'){while(i<n&&src[i]!=='\n')i++;continue;}
    if(c==='/'&&src[i+1]==='*'){
      const start=line;i+=2;let closed=false;
      while(i<n){if(src[i]==='*'&&src[i+1]==='/'){i+=2;closed=true;break;}if(src[i]==='\n')line++;i++;}
      if(!closed)throw new JErr(start,'unclosed comment','A paragraph comment starts with /* and must end with */. Add */ where the comment should stop.');
      continue;
    }
    if(c==='"'){
      let s='',j=i+1,ok=false;
      while(j<n){
        const d=src[j];
        if(d==='"'){ok=true;break;}
        if(d==='\n')break;
        if(d==='\\'){
          const e=src[j+1],map={n:'\n',t:'\t','"':'"','\\':'\\'};
          if(e in map){s+=map[e];j+=2;continue;}
          throw new JErr(line,'illegal escape character','Use \\n for a new line, \\t for a tab, \\" for a quote mark.');
        }
        s+=d;j++;
      }
      if(!ok)throw new JErr(line,'unclosed string literal','Text in quotes must be closed on the same line. Add the missing " at the end of the text.');
      toks.push({t:'str',v:s,line});i=j+1;continue;
    }
    if(c==="'")throw new JErr(line,'unclosed character literal','Use double quotes "..." for text. Single quotes are only for one character.');
    if(/[0-9]/.test(c)){
      let j=i;while(/[0-9]/.test(src[j]||''))j++;
      let dec=false;
      if(src[j]==='.'&&/[0-9]/.test(src[j+1]||'')){dec=true;j++;while(/[0-9]/.test(src[j]||''))j++;}
      toks.push({t:'num',v:src.slice(i,j),dec,line});i=j;continue;
    }
    if(/[A-Za-z_$]/.test(c)){
      let j=i;while(/[A-Za-z0-9_$]/.test(src[j]||''))j++;
      toks.push({t:'id',v:src.slice(i,j),line});i=j;continue;
    }
    if(c==='+'&&src[i+1]==='+'){toks.push({t:'sym',v:'++',line});i+=2;continue;}
    if(c==='-'&&src[i+1]==='-'){toks.push({t:'sym',v:'--',line});i+=2;continue;}
    if('{}()[];.,+-*/%='.includes(c)){toks.push({t:'sym',v:c,line});i++;continue;}
    throw new JErr(line,"illegal character: '"+c+"'",'This character is not allowed here. Check for a typing mistake.');
  }
  toks.push({t:'eof',v:'<end of file>',line});
  return toks;
}

function fmtD(x){
  if(Number.isInteger(x)&&Math.abs(x)<1e7)return x.toFixed(1);
  return String(x);
}
function toS(v,ty){return ty==='double'?fmtD(v):String(v);}

function compile(src){
  const toks=tokenize(src);
  let p=0;const imports=new Set(),decl={},inited=new Set();
  const cur=()=>toks[Math.min(p,toks.length-1)];
  const peek=(k=0)=>toks[Math.min(p+k,toks.length-1)];
  const next=()=>{const t=cur();if(t.t!=='eof')p++;return t;};
  const lastLine=()=>p>0?toks[Math.min(p-1,toks.length-1)].line:1;
  const isSym=(v,k=0)=>{const t=peek(k);return t.t==='sym'&&t.v===v;};
  const isId=(v,k=0)=>{const t=peek(k);return t.t==='id'&&t.v===v;};
  const eofErr=()=>new JErr(cur().line,'reached end of file while parsing','A closing brace } is missing. Every { needs its own }.');
  const caseOf=(tok,word)=>tok.t==='id'&&tok.v!==word&&tok.v.toLowerCase()===word;
  function expectSym(v,hint){
    if(isSym(v))return next();
    if(v===';')throw new JErr(lastLine(),"';' expected",hint||'Every statement ends with a semicolon ( ; ).');
    if(cur().t==='eof')throw eofErr();
    throw new JErr(cur().line,"'"+v+"' expected",hint||'');
  }
  function mkBin(op,l,r){
    if(l.ty==='String'||r.ty==='String'){
      if(op.v!=='+')throw new JErr(op.line,"bad operand types for binary operator '"+op.v+"'",'Only + can be used with text (it joins the pieces together).');
      return {k:'bin',op:'+',l,r,ty:'String',line:op.line};
    }
    return {k:'bin',op:op.v,l,r,ty:(l.ty==='double'||r.ty==='double')?'double':'int',line:op.line};
  }
  function parseExpr(){return parseAdd();}
  function parseAdd(){let l=parseMul();while(isSym('+')||isSym('-')){const op=next();const r=parseMul();l=mkBin(op,l,r);}return l;}
  function parseMul(){let l=parseUnary();while(isSym('*')||isSym('/')||isSym('%')){const op=next();const r=parseUnary();l=mkBin(op,l,r);}return l;}
  function requireNumVar(t,opv){
    if(!Object.prototype.hasOwnProperty.call(decl,t.v))throw new JErr(t.line,'cannot find symbol: variable '+t.v,'Declare the variable first, for example: int '+t.v+' = 5;');
    if(decl[t.v]==='String')throw new JErr(t.line,"bad operand type String for unary operator '"+opv+"'",opv+' only works on numbers (int or double), not text.');
    if(!inited.has(t.v))throw new JErr(t.line,'variable '+t.v+' might not have been initialized','Give the variable a value first, for example: '+t.v+' = 5;');
  }
  function parseUnary(){
    if(isSym('-')){const op=next();const e=parseUnary();if(e.ty==='String')throw new JErr(op.line,'bad operand type String for unary operator -','');return {k:'neg',e,ty:e.ty};}
    if(isSym('++')||isSym('--')){
      const op=next();const t=cur();
      if(t.t!=='id')throw new JErr(op.line,'unexpected type',op.v+' must be followed by a variable, for example: '+op.v+'count;');
      requireNumVar(t,op.v);next();
      return {k:'preinc',name:t.v,op:op.v,ty:decl[t.v],line:op.line};
    }
    return parsePostfix();
  }
  function parsePostfix(){
    const e=parsePrimary();
    if(e.k==='var'&&(isSym('++')||isSym('--'))){
      const op=next();
      if(e.ty==='String')throw new JErr(op.line,"bad operand type String for unary operator '"+op.v+"'",op.v+' only works on numbers (int or double), not text.');
      return {k:'postinc',name:e.name,op:op.v,ty:e.ty,line:op.line};
    }
    return e;
  }
  function parsePrimary(){
    const t=next();
    if(t.t==='str')return {k:'lit',v:t.v,ty:'String'};
    if(t.t==='num')return t.dec?{k:'lit',v:parseFloat(t.v),ty:'double'}:{k:'lit',v:parseInt(t.v,10),ty:'int'};
    if(t.t==='id'){
      if(Object.prototype.hasOwnProperty.call(decl,t.v)){
        if(!inited.has(t.v))throw new JErr(t.line,'variable '+t.v+' might not have been initialized','Give the variable a value first, for example: '+t.v+' = 5;');
        return {k:'var',name:t.v,ty:decl[t.v],line:t.line};
      }
      throw new JErr(t.line,'cannot find symbol: variable '+t.v,'Java does not know the word '+t.v+'. If you meant text, put it in double quotes: "'+t.v+'". If it is a variable, declare it first.');
    }
    if(t.t==='sym'&&t.v==='('){const e=parseExpr();expectSym(')','Close the parentheses with ).');return e;}
    if(t.t==='eof')throw new JErr(lastLine(),'illegal start of expression','The code stops too early. Something is missing here.');
    throw new JErr(t.line,'illegal start of expression','Unexpected "'+t.v+'". Check your typing.');
  }
  function checkAssign(ty,e,line){
    if(ty===e.ty)return;
    if(ty==='double'&&e.ty==='int')return;
    if(ty==='int'&&e.ty==='double')throw new JErr(line,'incompatible types: possible lossy conversion from double to int','An int holds whole numbers only. Use double for numbers with decimals.');
    throw new JErr(line,'incompatible types: '+e.ty+' cannot be converted to '+ty,ty==='String'?'Text needs double quotes: "..."':'An '+ty+' variable holds a number, not text.');
  }
  function parsePrint(){
    const first=next();
    expectSym('.','Use System.out.println(...)');
    const o=cur();
    if(!(o.t==='id'&&o.v==='out')){
      const low=(o.v||'').toLowerCase();
      throw new JErr(o.line,'cannot find symbol: '+o.v,(low==='print'||low==='println')?'The word out is missing. Write System.out.'+low+'(...).':(caseOf(o,'out')?'Java is case-sensitive: write out in lowercase.':'Print with System.out.println(...) or System.out.print(...).'));
    }
    next();expectSym('.','Use System.out.println(...)');
    const m=next();
    const low=(m.v||'').toLowerCase();
    if(!(m.t==='id'&&(m.v==='print'||m.v==='println'))){
      if(low==='print'||low==='println')throw new JErr(m.line,'cannot find symbol: method '+m.v,'Java is case-sensitive: write '+low+' in lowercase.');
      throw new JErr(m.line,'cannot find symbol: method '+m.v,'Use print or println to show text on the console.');
    }
    expectSym('(','Put the text to print inside parentheses: '+m.v+'("...")');
    let arg=null;
    if(!isSym(')'))arg=parseExpr();
    expectSym(')','Close the parentheses with ). Every ( needs a matching ).');
    expectSym(';','Every statement ends with a semicolon ( ; ).');
    if(m.v==='print'&&!arg)throw new JErr(m.line,'no suitable method found for print()','print needs something to show. Use println() to print an empty line.');
    return {k:'print',nl:m.v==='println',arg,line:first.line};
  }
  function parseDialog(){
    const j=next();
    if(!(imports.has('javax.swing.JOptionPane')||imports.has('javax.swing.*')))
      throw new JErr(j.line,'cannot find symbol: class JOptionPane','Add this line at the very top of the file:  import javax.swing.JOptionPane;');
    expectSym('.','Use JOptionPane.showMessageDialog(...)');
    const m=next();
    if(!(m.t==='id'&&m.v==='showMessageDialog'))throw new JErr(m.line,'cannot find symbol: method '+m.v,(m.v||'').toLowerCase()==='showmessagedialog'?'Java is case-sensitive: write showMessageDialog exactly like that.':'Use showMessageDialog to show a message box.');
    expectSym('(','Open the parentheses with (');
    const a1=next();
    if(!(a1.t==='id'&&a1.v==='null'))throw new JErr(a1.line,'first argument should be null','Start with null:  showMessageDialog(null, "message")');
    expectSym(',','Separate the arguments with commas.');
    const msg=parseExpr();let title=null,type=null;
    if(isSym(',')){
      next();title=parseExpr();
      if(isSym(',')){
        next();const c=next();
        if(!(c.t==='id'&&c.v==='JOptionPane'))throw new JErr(c.line,'message type expected','Use a type such as JOptionPane.INFORMATION_MESSAGE');
        expectSym('.');const k=next();
        if(!['INFORMATION_MESSAGE','ERROR_MESSAGE','WARNING_MESSAGE','QUESTION_MESSAGE','PLAIN_MESSAGE'].includes(k.v))throw new JErr(k.line,'cannot find symbol: '+k.v,'Try JOptionPane.INFORMATION_MESSAGE');
        type=k.v;
      }
    }
    expectSym(')','Close the parentheses with ).');
    expectSym(';','Every statement ends with a semicolon ( ; ).');
    return {k:'dialog',msg,title,type,line:j.line};
  }
  function parseDecl(){
    const ty=next();const nm=next();
    if(nm.t!=='id'||KEYWORDS.has(nm.v)){
      throw new JErr(nm.line,'<identifier> expected',nm.t==='id'?nm.v+' is a reserved word: it already has a special meaning, so it cannot be used as a name. Try a name like count.':'A variable needs a name, for example: int count = 5;');
    }
    if(Object.prototype.hasOwnProperty.call(decl,nm.v))throw new JErr(nm.line,'variable '+nm.v+' is already defined','Use a new name, or remove the type to give the old variable a new value.');
    let init=null;
    if(isSym('=')){next();init=parseExpr();checkAssign(ty.v,init,nm.line);}
    expectSym(';','Every statement ends with a semicolon ( ; ).');
    decl[nm.v]=ty.v;if(init)inited.add(nm.v);
    return {k:'decl',name:nm.v,ty:ty.v,init,line:ty.line};
  }
  function parseStatement(){
    const t=peek();
    if(isSym('{')){next();return {k:'block',body:parseBlock(),line:t.line};}
    if(isSym(';')){next();return null;}
    if(isSym('++')||isSym('--')){const e=parseExpr();expectSym(';','Every statement ends with a semicolon ( ; ).');return {k:'exprstmt',e,line:t.line};}
    if(t.t==='id'){
      if(t.v==='System')return parsePrint();
      if(t.v.toLowerCase()==='system')throw new JErr(t.line,'cannot find symbol: '+t.v,'Java is case-sensitive: System starts with a capital S.');
      if(t.v==='JOptionPane')return parseDialog();
      if(t.v==='int'||t.v==='String'||t.v==='double')return parseDecl();
      if(['int','string','double'].includes(t.v.toLowerCase()))throw new JErr(t.line,'cannot find symbol: class '+t.v,'Java is case-sensitive: write '+(t.v.toLowerCase()==='string'?'String':t.v.toLowerCase())+' exactly like that.');
      if(KEYWORDS.has(t.v))throw new JErr(t.line,'illegal start of expression','The word '+t.v+' cannot be used inside the main method like this. Is a closing } missing above?');
      if((isSym('++',1)||isSym('--',1))&&Object.prototype.hasOwnProperty.call(decl,t.v)){const e=parseExpr();expectSym(';','Every statement ends with a semicolon ( ; ).');return {k:'exprstmt',e,line:t.line};}
      if(isSym('=',1)){
        next();next();const e=parseExpr();
        if(!Object.prototype.hasOwnProperty.call(decl,t.v))throw new JErr(t.line,'cannot find symbol: variable '+t.v,'Declare the variable first, for example: int '+t.v+' = 5;');
        checkAssign(decl[t.v],e,t.line);expectSym(';','Every statement ends with a semicolon ( ; ).');inited.add(t.v);
        return {k:'assign',name:t.v,e,line:t.line};
      }
      const low=t.v.toLowerCase();
      if((low==='println'||low==='print')&&isSym('(',1))throw new JErr(t.line,'cannot find symbol: method '+t.v,'Did you mean System.out.'+low+'(...)?');
      if(isSym('.',1)||isSym('(',1))throw new JErr(t.line,'cannot find symbol: '+t.v,'This simulator understands System.out.print/println, JOptionPane.showMessageDialog and simple variables.');
    }
    throw new JErr(t.line,'not a statement','A statement is an action such as System.out.println("Hi"); Check this line for a typing mistake.');
  }
  function parseBlock(){
    const out=[];
    while(!isSym('}')){
      if(cur().t==='eof')throw eofErr();
      const s=parseStatement();if(s)out.push(s);
    }
    next();return out;
  }
  /* ---- program ---- */
  while(isId('import')){
    const impLine=next().line;let name='';
    while(!isSym(';')){if(cur().t==='eof'||cur().line!==impLine)throw new JErr(impLine,"';' expected",'End the import line with a semicolon ( ; ).');name+=next().v;}
    next();imports.add(name);
  }
  let t=cur();
  if(caseOf(t,'public'))throw new JErr(t.line,'class, interface, enum, or record expected','Java is case-sensitive: write public in lowercase, not '+t.v+'.');
  if(isId('public')||isId('final')||isId('abstract'))next();
  t=cur();
  if(caseOf(t,'class'))throw new JErr(t.line,'class, interface, enum, or record expected','Java is case-sensitive: write class in lowercase, not '+t.v+'.');
  if(!isId('class'))throw new JErr(t.line,'class, interface, enum, or record expected','Every program lives inside a class:  public class Name { ... }');
  next();
  const nameTok=next();
  if(nameTok.t!=='id'||KEYWORDS.has(nameTok.v))throw new JErr(nameTok.line,'<identifier> expected','Give the class a name, for example: public class Welcome {');
  expectSym('{','A class body starts with { right after the class name.');
  let mainBody=null;
  while(!isSym('}')){
    if(cur().t==='eof')throw eofErr();
    const mm=[];
    while(cur().t==='id'&&['public','private','protected','static','final','abstract'].includes(cur().v))mm.push(next().v);
    const tt=cur();
    for(const w of ['public','static','void']){if(caseOf(tt,w))throw new JErr(tt.line,'<identifier> expected','Java is case-sensitive: write '+w+' in lowercase.');}
    if(!isId('void'))throw new JErr(tt.line,'<identifier> expected','Inside the class, put the main method:  public static void main(String[] args) { ... }  Statements cannot sit directly inside the class.');
    next();const mn=next();
    if(!(mn.t==='id'&&mn.v==='main'))throw new JErr(mn.line,'unsupported method: '+mn.v,(mn.v||'').toLowerCase()==='main'?'Java is case-sensitive: write main in lowercase.':'In this simulator, only the main method is supported.');
    expectSym('(','Write it as:  public static void main(String[] args)');
    let ps='';while(!isSym(')')){if(cur().t==='eof')throw eofErr();ps+=next().v;}
    next();
    if(ps!=='String[]args')throw new JErr(mn.line,'main method has the wrong parameters','The main method must look like:  public static void main(String[] args)');
    if(!(mm.includes('public')&&mm.includes('static')))throw new JErr(mn.line,'main method must be public static','Write it as:  public static void main(String[] args)');
    expectSym('{','The body of main starts with {');
    mainBody=parseBlock();
  }
  next();
  if(cur().t!=='eof')throw new JErr(cur().line,'class, interface, enum, or record expected','There is extra code after the class ends. Everything must be inside the class braces { }.');
  if(!mainBody)throw new JErr(nameTok.line,'no main method found','Add  public static void main(String[] args) { ... }  so Java knows where to start.');
  return {body:mainBody};
}

function evalExpr(e,env){
  switch(e.k){
    case 'lit':return e.v;
    case 'var':return env[e.name];
    case 'neg':return -evalExpr(e.e,env);
    case 'bin':{
      const a=evalExpr(e.l,env),b=evalExpr(e.r,env);
      if(e.op==='+')return e.ty==='String'?toS(a,e.l.ty)+toS(b,e.r.ty):a+b;
      if(e.op==='-')return a-b;
      if(e.op==='*')return a*b;
      if(e.op==='/'){if(e.ty==='int'){if(b===0)throw {rt:true,line:e.line,msg:'Exception in thread "main" java.lang.ArithmeticException: / by zero'};return Math.trunc(a/b);}return a/b;}
      if(e.op==='%'){if(e.ty==='int'&&b===0)throw {rt:true,line:e.line,msg:'Exception in thread "main" java.lang.ArithmeticException: / by zero'};return a%b;}
    }
    case 'preinc':{env[e.name]+=e.op==='++'?1:-1;return env[e.name];}
    case 'postinc':{const v=env[e.name];env[e.name]+=e.op==='++'?1:-1;return v;}
  }
}
function execute(prog){
  const env={},events=[],dialogs=[];let out='',error=null;
  const snap=(line,kind)=>events.push({line,kind,out,env:{...env},dialogs:dialogs.slice()});
  function exec(list){
    for(const s of list){
      if(s.k==='block')exec(s.body);
      else if(s.k==='print'){out+=(s.arg?toS(evalExpr(s.arg,env),s.arg.ty):'')+(s.nl?'\n':'');snap(s.line,'print');}
      else if(s.k==='decl'){if(s.init)env[s.name]=evalExpr(s.init,env);snap(s.line,'decl');}
      else if(s.k==='assign'){env[s.name]=evalExpr(s.e,env);snap(s.line,'assign');}
      else if(s.k==='dialog'){dialogs.push({msg:toS(evalExpr(s.msg,env),s.msg.ty),title:s.title?toS(evalExpr(s.title,env),s.title.ty):'Message',type:s.type||'INFORMATION_MESSAGE'});snap(s.line,'dialog');}
      else if(s.k==='exprstmt'){evalExpr(s.e,env);snap(s.line,'expr');}
    }
  }
  try{exec(prog.body);}catch(e){if(e&&e.rt)error=e;else throw e;}
  return {out,events,dialogs,error};
}
function javaRun(src){
  try{const prog=compile(src);return {ok:true,...execute(prog)};}
  catch(e){if(e instanceof JErr)return {ok:false,err:e};throw e;}
}

const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c));}
  return el;
}
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};

function checkBadges(){
  for(const b of BADGES){if(!S.badges[b.id]&&b.test(S)){S.badges[b.id]=true;toast('Badge unlocked: '+b.name,'badge-t');}}
}
function award(ok,pts){
  if(ok){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);const bonus=Math.min(S.streak-1,5);S.xp+=pts+bonus;toast('+'+(pts+bonus)+' XP'+(S.streak>=3?'  ·  streak '+S.streak:''));}
  else S.streak=0;
  checkBadges();save();renderMe();
}
function renderMe(){
  const pct=S.xp%100;
  $('#me').replaceChildren(
    h('div',{class:'row'},h('span',{class:'lv'},'Level '+lvl()+' · '+lvlName()),h('span',{},S.xp+' XP')),
    h('div',{class:'bar',role:'progressbar','aria-valuenow':pct,'aria-valuemin':0,'aria-valuemax':100},h('i',{style:'width:'+pct+'%'})),

}

/* code highlighting */
function hl(line){
  const t=line.trim();
  if(t.startsWith('/*')||t.startsWith('*')||t.startsWith('//'))return [h('span',{class:'cm'},line)];
  const out=[];const re=/(\/\/.*$)|("(?:[^"\\]|\\.)*")|(\b(?:public|class|static|void|int|double|String|import|private|protected|final|abstract)\b)|(\b\d+(?:\.\d+)?\b)/g;
  let last=0,m;
  while((m=re.exec(line))){
    if(m.index>last)out.push(line.slice(last,m.index));
    const cls=m[1]?'cm':m[2]?'st':m[3]?'kw':'num';
    out.push(h('span',{class:cls},m[0]));last=re.lastIndex;
  }
  if(last<line.length)out.push(line.slice(last));
  return out;
}
function codeBlock(lines){
  const pre=h('pre',{class:'code'});
  lines.forEach((l,i)=>{pre.append(...hl(l));if(i<lines.length-1)pre.append('\n');});
  return pre;
}

function drawFix(m){
  m=m||$('#main');m.replaceChildren();
  const f=FX.list[FX.i%FX.list.length];
  let phase=1,missLine=0,missOpt=0;
  const fb=h('div',{'aria-live':'polite'});const opts=h('div',{class:'opts',style:'margin-top:14px'});
  const nextBtn=h('button',{class:'btn',style:'display:none',onclick:()=>{FX.i++;drawFix();}},'Next bug');
  const rows=[];
  const all=f.eof?[...f.lines,null]:f.lines;
  all.forEach((l,i)=>{
    const isEof=l===null;
    const b=h('button',{onclick:()=>pickLine(i,b)},h('span',{class:'n'},String(i+1)),isEof?h('span',{class:'eof'},'‹ end of file ›'):h('span',{},...hl(l||' ')));
    rows.push(b);
  });
  function pickLine(i,b){
    if(phase!==1)return;
    if(i===f.bad){
      phase=2;b.classList.add('flag');rows.forEach(r=>r.disabled=true);
      fb.replaceChildren(h('div',{class:'fb info'},h('b',{},'You found it!'),f.q));

      fb.replaceChildren(h('div',{class:'fb no'},'That line is fine. Look again.'));
    }
  }

    if(phase!==2)return;

      phase=3;btns.forEach((o,i)=>{o.disabled=true;if(i===f.a)o.classList.add('right');});
      const rb=rows[f.bad];
      rb.replaceChildren(h('span',{class:'n'},String(f.bad+1)),h('span',{},...hl(f.fix)));

      fb.replaceChildren(h('div',{class:'fb ok'},h('b',{},'Fixed!'),f.why));
      S.stats.fix++;award(true,missLine===0&&missOpt===0?15:8);
      nextBtn.style.display='';nextBtn.focus();
    }else{

      missOpt++;btns[k].classList.add('wrong');btns[k].disabled=true;
      fb.replaceChildren(h('div',{class:'fb no'},'Not that one. Try another option.'));
    }
  }

/* ---------- BUILD ---------- */
let BD=null;
function viewBuild(m){BD={list:shuffle(pool(BUILD)),i:0};drawBuild(m);}
function autoIndent(texts){
  let lv=0;
  return texts.map(t=>{const s=t.trim();if(s.startsWith('}'))lv=Math.max(0,lv-1);const out='  '.repeat(lv)+s;if(s.endsWith('{'))lv++;return out;});
}
function drawBuild(m){
  m=m||$('#main');m.replaceChildren();
  const b=BD.list[BD.i%BD.list.length];
  const items=shuffle([...b.lines.map((t,i)=>({id:'c'+i,t})),...b.extra.map((t,i)=>({id:'x'+i,t}))]);
  let asm=[],used=false,hinted=false;
  const bank=h('div',{class:'zone'}),tray=h('div',{class:'zone'}),cons=h('div',{class:'console',style:'margin-top:14px'});
  const fb=h('div',{'aria-live':'polite'});

    bank.replaceChildren(h('h3',{},'Code lines (tap to add)'));
    const free=items.filter(x=>!asm.includes(x.id));
    if(!free.length)bank.append(h('div',{class:'empty'},'All lines are used.'));
    free.forEach(x=>bank.append(h('div',{class:'piece'},h('button',{class:'txt',onclick:()=>{asm.push(x.id);paint();}},x.t))));
    tray.replaceChildren(h('h3',{},'Your program (auto-indented)'));
    if(!asm.length)tray.append(h('div',{class:'empty'},'Tap lines on the left to build the program.'));
    const ind=autoIndent(asm.map(id=>items.find(x=>x.id===id).t));
    asm.forEach((id,i)=>{
      tray.append(h('div',{class:'piece'},
        h('button',{class:'txt',title:'Tap to remove',onclick:()=>{asm.splice(i,1);paint();}},...hl(ind[i])),
        h('span',{class:'mv'},h('button',{'aria-label':'Move up',onclick:()=>{if(i>0){[asm[i-1],asm[i]]=[asm[i],asm[i-1]];paint();}}},'▲'),h('button',{'aria-label':'Move down',onclick:()=>{if(i<asm.length-1){[asm[i+1],asm[i]]=[asm[i],asm[i+1]];paint();}}},'▼'))));
    });
  }
  function run(){
    if(!asm.length){fb.replaceChildren(h('div',{class:'fb info'},'Add some lines first.'));return;}
    const src=autoIndent(asm.map(id=>items.find(x=>x.id===id).t)).join('\n')+'\n';

    if(!r.ok){renderConsole(cons,{err:r.err,src});fb.replaceChildren(h('div',{class:'fb no'},h('b',{},'The program does not compile.'),'Read the message in the console, then change your lines.'));if(!used)award(false,0);used=true;return;}
    renderConsole(cons,{out:r.out,dialogs:r.dialogs,caret:false,rt:r.error});
    const ok=b.check.dialog!==undefined?r.dialogs.some(d=>d.msg===b.check.dialog):r.out.trimEnd()===b.check.out;
    if(ok){
      fb.replaceChildren(h('div',{class:'fb ok'},h('b',{},'It works!'),'Your program compiles and does exactly what the goal asks.'));
      S.stats.build++;award(true,hinted||used?10:20);nextBtn.style.display='';nextBtn.focus();
    }else{
      if(!used)award(false,0);used=true;
      fb.replaceChildren(h('div',{class:'fb no'},h('b',{},'It runs, but the output is not what the goal asks for.'),'Check the order of the lines, and whether you need print or println.'));

    fb.replaceChildren(h('div',{class:'fb info'},h('b',{},k===0&&!asm.length?'Start with:':'Next correct line:'),h('code',{style:'font-family:var(--f-mono)'},exp[Math.min(k,exp.length-1)])));
  }

    h('p',{class:'lead'},'Put the lines in the right order to reach the goal. Some lines are traps: they contain mistakes, so leave them out.'),
    h('div',{class:'panel'},h('div',{class:'topline'},h('h2',{},b.title),lecChip(b.lec)),
      h('div',{class:'fb info',style:'margin:12px 0'},h('b',{},'Goal'),b.goal),
      h('div',{class:'buildgrid'},bank,tray),
      h('div',{class:'btnrow'},h('button',{class:'btn go',onclick:run},'Run program'),h('button',{class:'btn ghost',onclick:()=>{asm=[];paint();}},'Clear'),h('button',{class:'btn ghost',onclick:hint},'Hint'),nextBtn),
      fb,cons));

/* ---------- MATCH ---------- */
let MT=null;
function viewMatch(m){
  const chosen=shuffle(pool(PAIRS)).slice(0,6).map((p,i)=>({...p,id:i}));
  MT={chosen,left:shuffle(chosen),right:shuffle(chosen),sel:null,done:new Set(),miss:0,t0:Date.now()};
  drawMatch(m);
}
function drawMatch(m){
  m=m||$('#main');m.replaceChildren();
  const lc=h('div',{class:'col'}),rc=h('div',{class:'col'});
  const tiles={};
  function mk(p,side){
    const t=h('button',{class:'tile'+(side==='L'&&p.mono?' mono':''),onclick:()=>tap(p,side,t)},side==='L'?p.a:p.b);
    tiles[side+p.id]=t;return t;
  }
  MT.left.forEach(p=>lc.append(mk(p,'L')));MT.right.forEach(p=>rc.append(mk(p,'R')));
  const status=h('div',{class:'fb info','aria-live':'polite'},'Pick a term on the left, then its meaning on the right.');
  function tap(p,side,t){
    if(MT.done.has(p.id))return;
    if(MT.sel&&MT.sel.side===side){tiles[MT.sel.side+MT.sel.p.id].classList.remove('sel');}
    if(!MT.sel||MT.sel.side===side){MT.sel={p,side};t.classList.add('sel');return;}
    const other=MT.sel;const a=tiles[other.side+other.p.id];
    a.classList.remove('sel');
    if(other.p.id===p.id){
      MT.done.add(p.id);a.classList.add('done');t.classList.add('done');a.disabled=t.disabled=true;
      award(true,5);MT.sel=null;
      status.textContent=MT.done.size+' of 6 matched.';
      if(MT.done.size===6)finish();
    }else{
      MT.miss++;award(false,0);MT.sel=null;
      [a,t].forEach(x=>{x.classList.remove('miss');void x.offsetWidth;x.classList.add('miss');});
      status.textContent='Not a match. Try again.';
    }
  }
  function finish(){
    S.stats.match++;const secs=Math.round((Date.now()-MT.t0)/1000);
    const bonus=Math.max(5,30-MT.miss*5);S.xp+=bonus;checkBadges();save();renderMe();
    m.append(h('div',{class:'panel result'},h('h2',{},'All matched!'),h('p',{class:'lead',style:'margin:8px auto'},'Time: '+secs+' s  ·  Mistakes: '+MT.miss+'  ·  Bonus: +'+bonus+' XP'),
      h('div',{class:'btnrow',style:'justify-content:center'},h('button',{class:'btn',onclick:()=>go('match')},'New round'),h('button',{class:'btn sec',onclick:()=>go('quiz')},'Take a quiz'))));
  }
  m.append(h('h1',{},'Match Up'),h('p',{class:'lead'},'Connect each term with its meaning. Six pairs per round.'),
    h('div',{class:'panel'},status,h('div',{class:'pairs'},lc,rc)));
}

/* ---- instructor PIN (private area) ---- */
async function sha256Hex(text){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function askPin(){
  const inp=h('input',{class:'inp',type:'password',inputmode:'numeric',maxlength:'12',autocomplete:'off'});
  const err=h('div',{class:'err'},'');
  const box=openModal(h('div',{},

    h('p',{},'This part of the page is private. Enter the PIN to continue.'),
    inp,err,
    h('div',{class:'btnrow',style:'margin-top:14px'},
      h('button',{class:'btn',onclick:check},'Unlock'),
      h('button',{class:'btn ghost',onclick:closeModal},'Cancel'))));

    const v=inp.value.trim();
    if(!v){err.textContent='Type the PIN first.';return;}

  setTimeout(()=>inp.focus(),0);

/* ---- grading a typed command by running it ---- */
function gradeCmd(q,code){
  let src=code,off=0;
  if(!/\bclass\b/.test(code)){src=wrapSnippet(code.split('\n'));off=2;}
  if(q.imp&&!/import\s+javax\.swing/.test(src)){src='import javax.swing.JOptionPane;\n'+src;off+=1;}
  const r=javaRun(src);
  if(!r.ok)return {ok:false,kind:'compile',err:{...r.err,line:Math.max(1,r.err.line-off)}};
  let ok=true;
  if(q.dialog!==undefined)ok=r.dialogs.some(d=>d.msg===q.dialog);
  else if(q.out!==undefined)ok=q.loose?r.out.trimEnd()===q.out.trimEnd():r.out===q.out;
  if(!ok)return {ok:false,kind:'output',out:r.out,dialogs:r.dialogs};
  if(q.srcRe&&!q.srcRe.test(code))return {ok:false,kind:'shape',out:r.out,dialogs:r.dialogs};
  return {ok:true,out:r.out,dialogs:r.dialogs};
}
function fillCode(lines){
  const pre=h('pre',{class:'code'});
  lines.forEach((l,li)=>{
    l.split('____').forEach((part,pi,arr)=>{pre.append(...hl(part));if(pi<arr.length-1)pre.append(h('span',{class:'blank'},'?'));});
    if(li<lines.length-1)pre.append('\n');
  });
  return pre;
}

let SP=null;
function startSet(m,qs,opts){SP={qs,i:0,score:0,missed:[],opts:opts||{},cls:false};drawSet(m);}
function drawSet(m){
  m=m||$('#main');m.replaceChildren();m.classList.toggle('classmode',!!SP.cls);document.onkeydown=null;
  if(SP.i>=SP.qs.length)return setResult(m);
  const q=SP.qs[SP.i],shuffleO=SP.opts.shuffleO!==false;
  let locked=false,tries=0,revealFn=null;
  const body=h('div'),fb=h('div',{'aria-live':'polite'});
  const nextBtn=h('button',{class:'btn',style:'display:none',onclick:()=>{SP.i++;drawSet();}},SP.i===SP.qs.length-1?'See my result':'Next question');
  const info=(t,why)=>h('div',{class:'fb info'},h('b',{},t),why);
  function done(ok,xp){
    locked=true;nextBtn.style.display='';nextBtn.focus();
    if(ok)SP.score++;else SP.missed.push(q);
    if(ok&&q.cat!=='concept')S.stats.keyOk=(S.stats.keyOk||0)+1;
    award(ok,xp);
  }
  if(q.t==='mcq'){
    const idx=shuffleO?shuffle([0,1,2,3]):[0,1,2,3];
    const opts=idx.map(i=>q.o[i]),ans=idx.indexOf(q.a);
    const els=opts.map((t,i)=>h('button',{class:'opt',onclick:()=>pick(i)},h('span',{class:'k'},'ABCD'[i]),h('span',{},t)));
    const mark=p=>els.forEach((o,i)=>{o.disabled=true;if(i===ans)o.classList.add('right');else if(i===p)o.classList.add('wrong');});
    function pick(i){
      if(locked||SP.cls)return;mark(i);const ok=i===ans;
      fb.replaceChildren(h('div',{class:'fb '+(ok?'ok':'no')},h('b',{},ok?'Correct!':'Not quite. The answer is '+'ABCD'[ans]+'.'),q.why));
      done(ok,10);
    }
    revealFn=()=>{mark(-1);fb.replaceChildren(info('Answer: '+'ABCD'[ans],q.why));};
    body.append(h('div',{class:'opts',role:'group','aria-label':'Answers'},els));
    document.onkeydown=e=>{if(SP.cls)return;const k=e.key.toLowerCase();if(k.length===1&&'abcd'.includes(k))pick('abcd'.indexOf(k));};
  }else if(q.t==='fill'){
    const inp=h('input',{class:'inp',type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Your answer'});
    const chk=h('button',{class:'btn',onclick:check},'Check');
    function check(){
      if(locked||SP.cls)return;
      const v=inp.value.trim();
      if(!v){fb.replaceChildren(info('Type your answer first.',''));return;}
      tries++;
      if(q.ans.includes(v)){fb.replaceChildren(h('div',{class:'fb ok'},h('b',{},'Correct!'),q.why));inp.disabled=true;chk.style.display='none';done(true,tries===1?12:6);}
      else if(tries>=2){fb.replaceChildren(h('div',{class:'fb no'},h('b',{},'The answer is: '+q.ans[0]),q.why));inp.disabled=true;chk.style.display='none';done(false,0);}
      else{const near=q.ans.some(a=>a.toLowerCase()===v.toLowerCase());fb.replaceChildren(h('div',{class:'fb no'},h('b',{},'Not quite.'),near?'Careful: Java is case-sensitive. Check the capital letters.':'Try once more.'));}
    }
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
    revealFn=()=>fb.replaceChildren(info('Answer: '+q.ans[0],q.why));
    body.append(fillCode(q.code));
    if(!SP.cls)body.append(h('label',{class:'lab',for:'fillIn'},'Type the missing keyword or symbol:'),(inp.id='fillIn',inp),h('div',{class:'btnrow'},chk));
    if(!SP.cls)setTimeout(()=>inp.focus(),0);
  }else{
    const ta=h('textarea',{class:'ta',rows:3,spellcheck:'false',autocapitalize:'off','aria-label':'Your command'});
    const con=h('div',{class:'console',style:'display:none;margin-top:14px'});
    const chk=h('button',{class:'btn',onclick:check},'Run and check');
    const wantText=q.dialog!==undefined?'a dialog box that shows "'+q.dialog+'"':'the output shown in the console';
    function check(){
      if(locked||SP.cls)return;
      if(!ta.value.trim()){fb.replaceChildren(info('Type your command first.',''));return;}
      tries++;const r=gradeCmd(q,ta.value);
      if(r.ok){con.style.display='';renderConsole(con,{out:r.out,dialogs:r.dialogs,caret:false});fb.replaceChildren(h('div',{class:'fb ok'},h('b',{},'Correct!'),q.why));ta.disabled=true;chk.style.display='none';done(true,tries===1?15:8);return;}
      con.style.display='';
      let msg;
      if(r.kind==='compile'){renderConsole(con,{err:r.err,src:ta.value});msg=h('div',{class:'fb no'},h('b',{},'Java found an error on line '+r.err.line+' of your code.'),'Read the message and hint in the console, fix your command, and run it again.');}
      else{renderConsole(con,{out:r.out,dialogs:r.dialogs,caret:false});msg=h('div',{class:'fb no'},h('b',{},r.kind==='shape'?'The output is right, but the code is missing something.':'Your code runs, but it does not match the goal.'),r.kind==='shape'?(q.tip||''):'Goal: '+wantText+'. Check print or println, spaces, and quotes.');}
      if(tries>=2){msg.append(h('div',{style:'margin-top:8px'},'One correct answer:'),codeBlock(q.sample.split('\n')));ta.disabled=true;chk.style.display='none';done(false,0);}
      fb.replaceChildren(msg);
    }
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();check();}});
    revealFn=()=>fb.replaceChildren(info('One correct answer:',h('div',{style:'margin-top:6px'},codeBlock(q.sample.split('\n')))));
    if(!SP.cls)body.append(h('label',{class:'lab',for:'cmdIn'},'Your code (Ctrl+Enter to run):'),(ta.id='cmdIn',ta),h('div',{class:'btnrow'},chk),con);
    if(!SP.cls)setTimeout(()=>ta.focus(),0);
  }
  const reveal=h('button',{class:'btn',onclick:()=>{revealFn();reveal.style.display='none';nextBtn.style.display='';}},'Reveal answer');
  m.append(
    h('div',{class:'topline'},h('h1',{},SP.opts.title||'Keywords & Commands'),
      h('label',{class:'switch'},h('input',{type:'checkbox',checked:!!SP.cls,onchange:e=>{SP.cls=e.target.checked;drawSet();}}),'Class mode (teacher reveals the answer)')),
    h('div',{class:'panel'},
      h('div',{class:'topline'},h('span',{},'Question '+(SP.i+1)+' of '+SP.qs.length),h('span',{class:'tags'},h('span',{class:'chip cat'},CATNAME[q.cat]),lecChip(q.lec))),
      h('div',{class:'progress'},h('i',{style:'width:'+(SP.i/SP.qs.length*100)+'%'})),
      h('p',{class:'qtext'},q.q),
      body,fb,h('div',{class:'btnrow'},SP.cls?reveal:null,nextBtn)));
}
function setResult(m){
  const n=SP.qs.length,sc=SP.score;
  const kws=[...new Set(SP.missed.flatMap(q=>q.kw||[]))];
  const rep=['Java Lab: '+(SP.opts.title||'Keywords & Commands'),'Name: '+(S.name||'(not entered)'),'Score: '+sc+'/'+n,'Keywords to review: '+(kws.length?kws.join('  '):'none'),'Date: '+new Date().toISOString().slice(0,10)].join('\n');
  const ta=h('textarea',{class:'ta',rows:5,readonly:true,'aria-label':'Result to copy'});ta.value=rep;
  const cm=h('span',{class:'switch','aria-live':'polite'});
  const copy=()=>{ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}cm.textContent=ok?'Copied!':'Select the text and copy it.';};
  const nameIn=h('input',{class:'namein',type:'text',placeholder:'Your name',value:S.name,'aria-label':'Your name',oninput:e=>{S.name=e.target.value;save();ta.value=ta.value.replace(/^Name: .*$/m,'Name: '+(S.name||'(not entered)'));}});
  m.append(h('div',{class:'panel result'},h('h1',{},'Set complete'),h('div',{class:'big'},sc+' / '+n),
    h('p',{class:'lead',style:'margin:10px auto'},sc===n?'Perfect. You know these keywords and commands.':kws.length?'Review these keywords and commands, then retry the ones you missed.':'Retry the questions you missed.'),
    kws.length?h('div',{},h('b',{},'Keywords to review'),kwChips(kws)):null));
  if(SP.missed.length){
    m.append(h('div',{class:'panel'},h('h2',{},'Questions to review'),
      SP.missed.map(q=>h('div',{class:'qrow static'},h('span',{class:'chip cat'},CATNAME[q.cat]),h('div',{},h('div',{},q.t==='fill'?q.q+'  '+q.code.join(' '):q.q),h('div',{class:'ans'},'Answer: ',h('code',{},ansText(q))))))));
  }
  m.append(h('div',{class:'panel'},h('h2',{},'Share your result'),h('div',{class:'btnrow'},nameIn),h('div',{style:'margin-top:10px'},ta),
    h('div',{class:'btnrow'},h('button',{class:'btn',onclick:copy},'Copy result'),cm)));
  m.append(h('div',{class:'btnrow'},
    SP.missed.length?h('button',{class:'btn',onclick:()=>{const again=SP.missed.slice();startSet(m,again,SP.opts);}},'Retry missed ('+SP.missed.length+')'):null,
    SP.opts.back==='teacher'?h('button',{class:'btn sec',onclick:()=>go('teacher')},'Back to instructor tools'):h('button',{class:'btn sec',onclick:()=>go(SP.opts.back||'keys')},SP.opts.back==='assigned'?'Back to the set':SP.opts.back==='lecture'?'Back to this lecture':'New set'),
    h('button',{class:'btn ghost',onclick:()=>go('home')},'Home')));
}

/* ---- Keywords & Commands (practice) ---- */
function viewKeys(m){
  const qs=shuffle(approvedFrom(keywordBank())).slice(0,10);
  if(!qs.length){m.append(h('h1',{},'Keywords & Commands'),h('p',{class:'lead'},'No keyword or command questions have been approved yet for this filter. Try "Both" lectures, or check back soon.'));return;}
  startSet(m,qs,{title:'Keywords & Commands',shuffleO:true,back:'keys'});
}

/* ---- Instructor's assigned set (student side) ---- */
function viewAssigned(m){
  const set=SITE.assign;
  if(!set||!set.ids||!set.ids.length){m.append(h('h1',{},"Assigned Set"),h('p',{class:'lead'},'Your instructor has not assigned a set yet.'));return;}
  const qs=setQs(set);
  const counts={};qs.forEach(q=>counts[q.cat]=(counts[q.cat]||0)+1);
  const kws=[...new Set(qs.flatMap(q=>q.kw||[]))];
  m.append(h('h1',{},set.title||"Assigned Set"),
    h('p',{class:'lead'},qs.length+' questions chosen by your instructor, on the keywords and commands of the lectures.'),
    h('div',{class:'panel'},
      h('div',{class:'tags'},Object.entries(counts).map(([c,k])=>h('span',{class:'chip cat'},k+' × '+CATNAME[c]))),
      kws.length&&set.showKw!==false?h('div',{style:'margin-top:14px'},h('b',{},'Keywords and commands in this set'),kwChips(kws.slice(0,40))):null,
      h('div',{class:'btnrow'},h('button',{class:'btn',onclick:()=>startSet(m,setQs(set),{title:set.title||"Assigned Set",shuffleO:set.shuffleO!==false,back:'assigned'})},'Start the set'))));
}

/* ---- Instructor tools (private, PIN-gated) ---- */
let TTAB='review';
function viewTeacher(m){
  const tabs=[['review','Review & Approve'],['lectures','Lectures'],['add','Add Question'],['assign','Assign a Set'],['export','Export']];
  m.append(h('h1',{},'Instructor Area'),
    h('p',{class:'lead'},'Private to you. Review questions, manage lectures, and export the file you upload to GitHub.'));
  const bar=h('div',{class:'tabbar'},tabs.map(([id,t])=>h('button',{'aria-current':TTAB===id?'page':null,onclick:()=>{TTAB=id;draw();}},t)));
  const body=h('div',{});
  m.append(bar,body);
  function draw(){
    bar.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',tabs[i][0]===TTAB?'page':'false'));
    body.replaceChildren();
    ({review:drawReview,lectures:drawLectures,add:drawAdd,assign:drawAssign,export:drawExport})[TTAB](body);
  }
  draw();

  /* -- Review & Approve -- */
  function drawReview(body){
    const F={lec:'all',cat:'all',text:'',status:'all'};
    const list=h('div',{});
    const rows=[];
    const shown=h('span',{class:'switch'},'');
    function paintRow(q){
      const approved=isApproved(q.id);
      const cb=h('input',{type:'checkbox',checked:approved,'aria-label':'Approve question',onchange:()=>{setApproved(q.id,cb.checked);save();paintRow(q);shown.textContent=shown.textContent;}});
      const el=h('label',{class:'qrow'+(approved?' on':'')},cb,h('div',{},
        h('div',{class:'tags'},h('span',{class:'chip cat'},CATNAME[q.cat]),lecChip(q.lec),!q.id.startsWith('u')?null:h('span',{class:'pill new'},'your question'),(q.kw||[]).slice(0,3).map(k=>h('code',{class:'kwc small'},k))),
        h('div',{class:'qq'},q.q),
        q.t==='fill'?h('div',{style:'margin-top:6px'},fillCode(q.code)):null,
        h('div',{class:'ans'},'Answer: ',h('code',{},ansText(q)))));
      const idx=rows.findIndex(r=>r.q.id===q.id);
      if(idx>-1){rows[idx].el.replaceWith(el);rows[idx].el=el;}
      return el;
    }
    allQuestions().forEach(q=>{const el=paintRow(q);rows.push({q,el});list.append(el);});
    function matches(q){
      if(F.lec!=='all'&&String(q.lec)!==F.lec)return false;
      if(F.cat!=='all'&&q.cat!==F.cat)return false;
      if(F.status==='approved'&&!isApproved(q.id))return false;
      if(F.status==='pending'&&isApproved(q.id))return false;
      if(F.text){const t=F.text.toLowerCase();const hay=(q.q+' '+(q.kw||[]).join(' ')+' '+(q.code||[]).join(' ')+' '+(q.o||[]).join(' ')+' '+ansText(q)).toLowerCase();if(!hay.includes(t))return false;}
      return true;
    }
    function applyFilter(){let n=0;rows.forEach(r=>{const ok=matches(r.q);r.el.style.display=ok?'':'none';if(ok)n++;});shown.textContent=n+' shown';}
    const cats=[['all','All types'],['concept','Concept questions'],['keyword','Keyword questions'],['fill','Fill in the keyword'],['cmd','Type the command']];
    body.append(
      h('p',{class:'lead',style:'font-size:15px'},'Only approved questions (ticked) are ever shown to students, in the quiz, keyword practice and lecture pages. Anything you add stays hidden until you tick it here.'),
      h('div',{class:'filters'},
        h('select',{'aria-label':'Lecture',onchange:e=>{F.lec=e.target.value;applyFilter();}},[['all','All lectures'],...allLectures().map(l=>[String(l.lec),'Lecture '+l.lec])].map(([v,t])=>h('option',{value:v},t))),
        h('select',{'aria-label':'Question type',onchange:e=>{F.cat=e.target.value;applyFilter();}},cats.map(([v,t])=>h('option',{value:v},t))),
        h('select',{'aria-label':'Status',onchange:e=>{F.status=e.target.value;applyFilter();}},[['all','Any status'],['approved','Approved only'],['pending','Waiting for review']].map(([v,t])=>h('option',{value:v},t))),
        h('input',{class:'namein',type:'search',placeholder:'Search, e.g. println',style:'min-width:0;flex:1 1 200px','aria-label':'Search',oninput:e=>{F.text=e.target.value.trim();applyFilter();}}),
        shown),
      h('div',{class:'btnrow'},
        h('button',{class:'btn ghost',onclick:()=>{rows.forEach(r=>{if(r.el.style.display!=='none'){setApproved(r.q.id,true);paintRow(r.q);}});save();}},'Approve all shown'),
        h('button',{class:'btn ghost',onclick:()=>{rows.forEach(r=>{if(r.el.style.display!=='none'){setApproved(r.q.id,false);paintRow(r.q);}});save();}},'Unapprove all shown')),
      list);
    applyFilter();
  }
  function setApproved(id,val){
    const has=SITE.approved.includes(id);
    if(val&&!has)SITE.approved.push(id);
    if(!val&&has)SITE.approved=SITE.approved.filter(x=>x!==id);
  }

  /* -- Lectures -- */
  function drawLectures(body){
    const nextNum=Math.max(0,...allLectures().map(l=>l.lec))+1;
    body.append(h('p',{class:'lead',style:'font-size:15px'},'Lectures 1 to 4 are built in. Add more here as you teach them — students will see them on the Lectures page once you export and re-upload.'));
    allLectures().forEach(l=>{
      body.append(h('div',{class:'panel'},
        h('div',{class:'topline'},h('h3',{},'Lecture '+l.lec+' — '+l.title),l.builtin?h('span',{class:'chip'},'built in'):h('button',{class:'btn ghost',onclick:()=>{if(confirm('Delete Lecture '+l.lec+'? This does not delete its questions.')){SITE.lectures=SITE.lectures.filter(x=>x.lec!==l.lec);draw();}}},'Delete')),
        h('div',{class:'notelabel'},'Key points'),h('ul',{class:'keypoints'},l.points.map(p=>h('li',{},...noteRuns(p)))),
        h('div',{class:'summarybox'},h('div',{class:'notelabel'},'In simple words'),h('p',{},l.summary))));
    });
    const numIn=h('input',{class:'namein',type:'number',value:nextNum,style:'width:100px'});
    const titleIn=h('input',{class:'namein',type:'text',placeholder:'Lecture title',style:'min-width:min(100%,340px)'});
    const ptsIn=h('textarea',{class:'ta',rows:6,placeholder:'One key point per line. Wrap important words in ** ** to highlight them, e.g.\n**Inheritance** lets a class reuse another class\'s code.'});
    const sumIn=h('textarea',{class:'ta',rows:3,placeholder:'A very simple one or two sentence summary.'});
    const err=h('div',{class:'err'},'');
    function addLecture(){
      const num=parseInt(numIn.value,10);
      if(!num||num<1){err.textContent='Give the lecture a number.';return;}
      if(allLectures().some(l=>l.lec===num)){err.textContent='Lecture '+num+' already exists.';return;}
      if(!titleIn.value.trim()){err.textContent='Give the lecture a title.';return;}
      const points=ptsIn.value.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!points.length){err.textContent='Add at least one key point.';return;}
      SITE.lectures.push({lec:num,title:titleIn.value.trim(),points,summary:sumIn.value.trim()||points[0],builtin:false});
      save();toast('Lecture '+num+' added.');draw();
    }
    body.append(h('div',{class:'panel'},h('h3',{},'Add a lecture'),
      h('div',{class:'formgrid'},
        h('div',{class:'formrow'},h('div',{},h('label',{},'Lecture number'),numIn),h('div',{},h('label',{},'Title'),titleIn)),
        h('div',{},h('label',{},'Key points (one per line)'),ptsIn),
        h('div',{},h('label',{},'Simple summary'),sumIn),
        err,h('div',{class:'btnrow'},h('button',{class:'btn',onclick:addLecture},'Add lecture')))));
  }

  /* -- Add Question -- */
  function drawAdd(body){
    const typeIn=h('select',{'aria-label':'Question type'},[['mcq','Multiple choice'],['fill','Fill in the blank'],['cmd','Type the command']].map(([v,t])=>h('option',{value:v},t)));
    const lecIn=h('select',{'aria-label':'Lecture'},allLectures().map(l=>h('option',{value:l.lec},'Lecture '+l.lec)));
    const fields=h('div',{});
    const err=h('div',{class:'err'},'');
    function drawFields(){
      fields.replaceChildren();err.textContent='';
      if(typeIn.value==='mcq'){
        fields.append(
          h('div',{},h('label',{},'Category'),h('select',{id:'catSel'},[['concept','Concept (Quick Quiz)'],['keyword','Keyword (Keywords & Commands)']].map(([v,t])=>h('option',{value:v},t)))),
          h('div',{},h('label',{},'Question'),h('textarea',{id:'qText',class:'ta',rows:2,placeholder:'What does the keyword private mean?'})),
          h('div',{},h('label',{},'Correct answer'),h('input',{id:'correct',class:'namein',type:'text',style:'width:100%'})),
          h('div',{},h('label',{},'Wrong answer 1'),h('input',{id:'w1',class:'namein',type:'text',style:'width:100%'})),
          h('div',{},h('label',{},'Wrong answer 2'),h('input',{id:'w2',class:'namein',type:'text',style:'width:100%'})),
          h('div',{},h('label',{},'Wrong answer 3'),h('input',{id:'w3',class:'namein',type:'text',style:'width:100%'})),
          h('div',{},h('label',{},'Why (shown after answering)'),h('textarea',{id:'why',class:'ta',rows:2})));
      }else if(typeIn.value==='fill'){
        fields.append(
          h('div',{},h('label',{},'Question'),h('textarea',{id:'qText',class:'ta',rows:2,placeholder:'Fill in the missing keyword.'})),
          h('div',{},h('label',{},'Code line(s) — use ____ for the blank'),h('textarea',{id:'code',class:'ta',rows:3,placeholder:'____ class Welcome {'})),
          h('div',{},h('label',{},'Accepted answer(s), comma-separated'),h('input',{id:'ans',class:'namein',type:'text',style:'width:100%',placeholder:'public'})),
          h('div',{},h('label',{},'Why (shown after answering)'),h('textarea',{id:'why',class:'ta',rows:2})));
      }else{
        fields.append(
          h('div',{},h('label',{},'Question'),h('textarea',{id:'qText',class:'ta',rows:2,placeholder:'Write the command that prints Hi.'})),
          h('div',{},h('label',{},'Expected result'),h('select',{id:'mode'},[['out','Console output'],['dialog','Dialog box message']].map(([v,t])=>h('option',{value:v},t)))),
          h('div',{},h('label',{},'Expected text'),h('textarea',{id:'expect',class:'ta',rows:2,placeholder:'Hi'})),
          h('div',{},h('label',{},'A correct solution (used to grade, and shown if the student gives up)'),h('textarea',{id:'sample',class:'ta',rows:3,placeholder:'System.out.println("Hi");'})),
          h('div',{},h('label',{},h('input',{type:'checkbox',id:'loose'}),' Ignore extra spaces / small formatting differences')),
          h('div',{},h('label',{},'Why (shown after answering)'),h('textarea',{id:'why',class:'ta',rows:2})));
      }
    }
    typeIn.onchange=drawFields;drawFields();
    function submit(){
      const lec=parseInt(lecIn.value,10);
      const $$=id=>fields.querySelector('#'+id);
      const why=$$('why').value.trim();
      const qText=$$('qText').value.trim();
      if(!qText){err.textContent='Write the question text.';return;}
      if(!why){err.textContent='Add a short explanation (why).';return;}
      let q=null;
      if(typeIn.value==='mcq'){
        const correct=$$('correct').value.trim(),w1=$$('w1').value.trim(),w2=$$('w2').value.trim(),w3=$$('w3').value.trim();
        if(!correct||!w1||!w2||!w3){err.textContent='Fill in the correct answer and all three wrong answers.';return;}
        const cat=$$('catSel').value;
        const idx=shuffle([0,1,2,3]);const opts4=[correct,w1,w2,w3];
        const o=idx.map(i=>opts4[i]),a=idx.indexOf(0);
        q={t:'mcq',lec,cat,q:qText,o,a,why,kw:[]};
      }else if(typeIn.value==='fill'){
        const code=$$('code').value.split('\n');
        if(!code.some(l=>l.includes('____'))){err.textContent='Use ____ somewhere in the code to mark the blank.';return;}
        const ans=$$('ans').value.split(',').map(s=>s.trim()).filter(Boolean);
        if(!ans.length){err.textContent='Give at least one accepted answer.';return;}
        q={t:'fill',lec,cat:'fill',q:qText,code,ans,why,kw:[]};
      }else{
        const mode=$$('mode').value,expect=$$('expect').value,sample=$$('sample').value.trim();
        if(!sample){err.textContent='Give a correct solution.';return;}
        if(!expect.trim()){err.textContent='Give the expected text.';return;}
        q={t:'cmd',lec,cat:'cmd',q:qText,sample,why,kw:[],loose:$$('loose').checked};
        if(mode==='dialog'){q.dialog=expect.trim();q.imp=true;}else{q.out=expect.endsWith('\n')?expect:expect+'\n';}
      }
      q.id='u'+(SITE.nextId++);
      SITE.customQuestions.push(q);
      save();toast('Question added — remember to approve it in Review & Approve.');
      typeIn.value='mcq';drawFields();
      fields.querySelectorAll('input,textarea').forEach(el=>{if(el.type==='checkbox')el.checked=false;else el.value='';});
      err.textContent='';
    }
    body.append(h('p',{class:'lead',style:'font-size:15px'},'New questions are hidden from students until you approve them in the Review tab.'),
      h('div',{class:'formgrid'},
        h('div',{class:'formrow'},h('div',{},h('label',{},'Type'),typeIn),h('div',{},h('label',{},'Lecture'),lecIn)),
        fields,err,h('div',{class:'btnrow'},h('button',{class:'btn',onclick:submit},'Add question'))));
  }

  /* -- Assign a Set -- */
  function drawAssign(body){
    const A=SITE.assign||(SITE.assign={title:'',ids:[],shuffleQ:false,shuffleO:true,showKw:true});
    const sel=new Set(A.ids);
    const approvedQs=allQuestions().filter(q=>isApproved(q.id));
    const list=h('div',{});
    const rows=[];
    const countEl=h('b',{},'');
    function refreshCount(){countEl.textContent=sel.size+(sel.size===1?' question selected':' questions selected');A.ids=approvedQs.filter(q=>sel.has(q.id)).map(q=>q.id);save();}
    approvedQs.forEach(q=>{
      const cb=h('input',{type:'checkbox',checked:sel.has(q.id),onchange:()=>{cb.checked?sel.add(q.id):sel.delete(q.id);refreshCount();}});
      const el=h('label',{class:'qrow'+(sel.has(q.id)?' on':'')},cb,h('div',{},h('div',{class:'tags'},h('span',{class:'chip cat'},CATNAME[q.cat]),lecChip(q.lec)),h('div',{class:'qq'},q.q)));
      rows.push(el);list.append(el);
    });
    body.append(
      h('p',{class:'lead',style:'font-size:15px'},'Optional: hand-pick a specific set (only from approved questions) for a particular assignment. This appears on the Home page as "Assigned Set".'),
      h('div',{class:'formgrid'},
        h('div',{},h('label',{},'Set title'),h('input',{class:'namein',type:'text',value:A.title,style:'width:100%',oninput:e=>{A.title=e.target.value;save();}})),
        h('div',{class:'btnrow'},
          h('label',{class:'switch'},h('input',{type:'checkbox',checked:A.shuffleQ,onchange:e=>{A.shuffleQ=e.target.checked;save();}}),'Shuffle question order'),
          h('label',{class:'switch'},h('input',{type:'checkbox',checked:A.shuffleO!==false,onchange:e=>{A.shuffleO=e.target.checked;save();}}),'Shuffle answer choices'))),
      approvedQs.length?h('div',{style:'margin-top:14px'},countEl,list):h('p',{class:'lead'},'Approve some questions first in the Review tab.'),
      h('div',{class:'btnrow',style:'margin-top:14px'},
        h('button',{class:'btn sec',onclick:()=>{if(!A.ids.length){toast('Pick at least one question first.');return;}startSet(m,setQs(A),{title:A.title||'Preview',shuffleO:A.shuffleO!==false,back:'teacher',noLog:true});}},'Preview as student'),
        h('button',{class:'btn ghost',onclick:()=>{A.ids=[];sel.clear();save();drawAssign(body);}},'Clear set')));
    refreshCount();
  }

  /* -- Export -- */
  function drawExport(body){
    const pinRow=h('div',{class:'btnrow'});
    pinRow.append(h('button',{class:'btn sec',onclick:()=>changePinFlow()},'Change instructor PIN'));
    function doExport(){
      const c=document.documentElement.cloneNode(true);
      ['#nav','#main','#me','#lecSeg','#toasts','#modalHost'].forEach(sel=>{const e=c.querySelector(sel);if(e)e.replaceChildren();});
      c.querySelector('#sitedata').textContent=JSON.stringify(SITE).replace(/</g,'\\u003c');
      const html='<!DOCTYPE html>\n'+c.outerHTML;
      const blob=new Blob([html],{type:'text/html'});
      const url=URL.createObjectURL(blob);
      const a=h('a',{href:url,download:'index.html'});document.body.append(a);a.click();a.remove();
      toast('Downloaded index.html');
    }
    body.append(
      h('p',{class:'lead',style:'font-size:15px'},'Everything you changed here (lectures, questions, approvals, and the assigned set) only exists on this device until you export and re-upload.'),
      h('div',{class:'panel'},h('h3',{},'1. Download the updated file'),
        h('button',{class:'btn go',onclick:doExport},'Download index.html')),
      h('div',{class:'panel'},h('h3',{},'2. Re-upload to GitHub'),
        h('p',{class:'lead',style:'font-size:14.5px'},'Open your repository on github.com, click index.html, click the pencil (Edit) or use Upload files, replace it with the file you just downloaded, keep the same filename, and commit. The live link updates in a minute or two.')),
      h('div',{class:'panel'},h('h3',{},'Instructor PIN'),
        h('p',{class:'lead',style:'font-size:14.5px'},'Change your PIN any time. You still need to export and re-upload for the new PIN to apply to the file students use.'),
        pinRow));
  }
}

buildChrome();
$('#instrBtn').onclick=()=>{if(UNLOCKED)go('teacher');else askPin();};
go('home');
